# java.io.tmpdir: /tmp is read-only inside some sandboxes; the Makefile
# makes this dir.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=build/jvm-tmp
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Privacy / telemetry posture.
# Belt-and-braces — Gradle build scans require a develocity plugin we never apply,
# but if a future contributor adds one, we want auto-publish off.
gradle.publish.skip=true
systemProp.gradle.scan.captureGoogleAnalytics=false

# Kotlin compiles inside the Gradle process: no compiler daemon.
kotlin.compiler.execution.strategy=in-process
