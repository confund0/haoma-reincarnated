name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 04:00 UTC — drives the dht-network job below. Offline
    # jobs run on every push/PR; the network test is too flaky to
    # gate merges on.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2025.1.1"
          install-go: false
          working-directory: ${{ matrix.module }}

  tor-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: make tor-verify

  # Network-dependent DHT round-trip — bootstrap against public DHT,
  # put a fresh BEP-44 mutable item, fetch it back, assert byte-equal.
  # Gated behind the `dhtnet` build tag so default `go test ./...`
  # stays offline-deterministic. Runs on schedule + manual dispatch
  # only (NOT on push/PR — public-DHT reachability is flaky enough
  # that a network blip would otherwise block unrelated merges).
  dht-network:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - run: go test -tags=dhtnet -run=TestIntegration_BootstrapPutGetRoundTrip -timeout=4m ./internal/dht/
